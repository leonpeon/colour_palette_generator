<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Colour Page</title>

    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;

        font-family: Arial, sans-serif;
        text-align: center;

        background: linear-gradient(135deg, #f5f5f5, #e8e8e8);
        color: #333;
    }

    h1 {
        margin-bottom: 30px;
        font-size: 42px;
        color: #222;
    }

    .image-container {
        margin: 0 auto 45px;
        max-width: 700px;
    }

    .image-container img {
        width: 100%;
        max-height: 450px;
        object-fit: contain;

        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .palette {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;

        width: 90%;
        max-width: 800px;
        margin: 0 auto 40px;
    }

    .colour-box {
        height: 90px;

        display: flex;
        justify-content: center;
        align-items: center;

        border-radius: 12px;

        color: white;
        font-size: 17px;
        font-weight: bold;

        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);

        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);

        transition: transform 0.2s, box-shadow 0.2s;
    }

    .colour-box:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
    }

    .button {
        display: inline-block;

        padding: 12px 30px;

        background-color: #333;
        color: white;

        text-decoration: none;
        border-radius: 8px;

        font-size: 16px;

        transition: 0.2s;
    }

    .button:hover {
        background-color: #555;
        transform: translateY(-2px);
    }
</style>


<h1>Top Ten Colours</h1>

<div class="image-container">
    <img src="{{ url_for('static', filename='check_image/image.jpg') }}">
</div>

<div class="palette">
    {% for colour in colour_list %}
        <div class="colour-box" style="background-color: {{ colour }};">
            {{ colour }}
        </div>
    {% endfor %}
</div>

<a href="/" class="button">Upload Another Image</a>
