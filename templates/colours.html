<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Colour Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
        }

        .colour-box {
            width: 100px;
            height: 50px;
            margin: 30px auto;
        }
    </style>
</head>

<body>

    <h1>Top Ten Colours</h1>

    <img src="{{ url_for('static', filename='check_image/image.jpg') }}">

    {% for colour in colour_list %}
        <div class="colour-box" style="background-color: {{ colour }};"></div>
    {% endfor %}

    <a href="/" class="button">Home</a>

</body>
</html>
