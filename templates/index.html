<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Ten Colours</title>


    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f5f5, #e8e8e8);
            color: #333;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 60px;
            margin-bottom: 10px;
            font-size: 42px;
            color: #222;
        }

        .subtitle {
            margin-bottom: 35px;
            color: #777;
            font-size: 16px;
        }

        .upload-container {
            background-color: white;
            padding: 35px;
            width: 90%;
            max-width: 500px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .upload-container form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            background-color: #fafafa;
            cursor: pointer;
        }

        input[type="file"]:hover {
            border-color: #999;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #555;
            transform: translateY(-2px);
        }

        .colour-box {
            width: 200px;
            height: 200px;
            background-color: #A0C0A0;
            margin: 30px auto;
            border-radius: 12px;
        }
    </style>

    <h1>Top Ten Colours</h1>

    <p class="subtitle">
        Upload an image to discover its most common colours.
    </p>

    <div class="upload-container">
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="image" accept="image/*">
            <button type="submit">Upload Image</button>
        </form>
    </div>
